<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prototypes Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .break-words { word-wrap: break-word; overflow-wrap: break-word; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans selection:bg-indigo-500/30">

    <!-- Glassmorphism Header -->
    <header class="sticky top-0 z-10 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-xl font-semibold tracking-tight text-white">Gemini Prototypes</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Empty State (Shows if the list below is empty) -->
        <div id="empty-state" class="text-center py-24 hidden animate-fade-in">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-900 mb-4 border border-slate-800 shadow-inner">
                <svg class="w-8 h-8 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <h3 class="text-lg font-medium text-slate-200">No prototypes yet</h3>
            <p class="mt-2 text-sm text-slate-500 max-w-sm mx-auto">Add your links into the HTML file to see them appear here.</p>
        </div>

        <!-- Prototype Grid -->
        <div id="prototypes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Tiles injected here via JavaScript -->
        </div>
    </main>

    <!-- Application Logic & Data -->
    <script>
        // ==========================================
        // ⬇️ ADD YOUR PROTOTYPES HERE ⬇️
        // ==========================================
        const prototypes = [
            {
                title: "Lending Haggle Prototype",
                url: "https://share.gemini.google/A1PI7OBQ1oGY",
                description: "Interactive dual view UI for haggling rewards between customer and agent.",
                dateAdded: "OCt 17, 2026"
            },
            {
                title: "Money Choices Game",
                url: "https://share.gemini.google/FXiCA5Mfd9bi",
                description: "Gamified financial instinct assessment of client when choosing cash loan options.",
                dateAdded: "Oct 17, 2026"
            },
            {
                title: "Health loan",
                url: "https://share.gemini.google/3AIjcmhYqWEn",
                description: "Integrated lending and reward platform with health clinics",
                dateAdded: "Oct 17, 2026"
            },
        ];
        // ==========================================
        // ⬆️ STOP EDITING ⬆️
        // ==========================================

        function renderPrototypes() {
            const grid = document.getElementById('prototypes-grid');
            const emptyState = document.getElementById('empty-state');
            
            grid.innerHTML = '';

            if (prototypes.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
            }

            prototypes.forEach(proto => {
                const tile = document.createElement('div');
                tile.className = 'group relative flex flex-col justify-between bg-slate-900 rounded-2xl border border-slate-800 p-6 hover:-translate-y-1 hover:shadow-[0_8px_30px_rgba(0,0,0,0.4)] hover:border-indigo-500/50 transition-all duration-300 animate-fade-in';
                
                tile.innerHTML = `
                    <div class="relative z-10">
                        <h2 class="text-lg font-semibold text-white break-words mb-3 leading-tight">${proto.title}</h2>
                        <p class="text-sm text-slate-400 mb-6 break-words line-clamp-3 leading-relaxed">${proto.description || '<span class="italic opacity-50">No description provided</span>'}</p>
                    </div>
                    
                    <div class="relative z-10 pt-4 border-t border-slate-800/80 flex items-center justify-between mt-auto">
                        <span class="text-[11px] font-medium tracking-wider text-slate-500 uppercase">${proto.dateAdded}</span>
                        <a href="${proto.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors">
                            Launch
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                        </a>
                    </div>
                    
                    <!-- Decorative background glow -->
                    <div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-indigo-500/5 to-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                `;
                grid.appendChild(tile);
            });
        }

        // Run the render function on page load
        renderPrototypes();
    </script>
</body>
</html>
